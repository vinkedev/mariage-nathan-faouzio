<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · RSVP Mariage Nathan & Faouzio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--or:#b8924a;--or-fonce:#8a6a2c;--nuit:#1d1a14;--ivoire:#fbf8f1;--doux:#6f6757;--trait:#e7ddc4;--blanc:#fff;--vert:#2e8b57;--rouge:#b03a2e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',sans-serif;background:var(--ivoire);color:#26221b;padding:2rem 1.2rem;min-height:100vh}
  h1,h2{font-family:'Cormorant Garamond',serif;font-weight:500}
  h1{text-align:center;font-size:2rem;margin-bottom:.3rem}
  .sub{text-align:center;color:var(--doux);margin-bottom:2rem;font-size:.95rem}
  .wrap{max-width:1100px;margin:0 auto}
  .gate{max-width:360px;margin:6rem auto;background:#fff;padding:2.2rem;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.08);text-align:center}
  .gate h2{margin-bottom:1rem}
  .gate input{width:100%;padding:.8rem;border:1px solid var(--trait);border-radius:6px;font:1rem 'Jost',sans-serif;margin-bottom:1rem;text-align:center}
  .gate button{width:100%;padding:.8rem;border:0;border-radius:6px;background:linear-gradient(135deg,var(--or),var(--or-fonce));color:#fff;font:500 1rem 'Jost',sans-serif;cursor:pointer}
  .gate .err{color:var(--rouge);font-size:.85rem;min-height:1.2em;margin-top:.6rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.6rem}
  .stat{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:1.2rem;text-align:center}
  .stat b{display:block;font:600 2rem 'Cormorant Garamond',serif;color:var(--or-fonce);font-variant-numeric:tabular-nums}
  .stat span{font-size:.82rem;color:var(--doux);letter-spacing:.04em}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;gap:1rem;flex-wrap:wrap}
  .toolbar input{padding:.55rem .8rem;border:1px solid var(--trait);border-radius:6px;font:1rem 'Jost',sans-serif;min-width:220px}
  .toolbar button{padding:.55rem 1rem;border:0;border-radius:6px;background:var(--nuit);color:#fff;cursor:pointer;font:500 .9rem 'Jost',sans-serif}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.05)}
  th{background:var(--nuit);color:#fff;text-align:left;padding:.85rem;font-weight:500;font-size:.85rem;letter-spacing:.04em}
  td{padding:.85rem;border-bottom:1px solid var(--trait);font-size:.92rem;vertical-align:top}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:.25rem .7rem;border-radius:999px;font-size:.78rem;font-weight:500}
  .badge--oui{background:rgba(46,139,87,.12);color:var(--vert)}
  .badge--non{background:rgba(176,58,46,.12);color:var(--rouge)}
  .mot{color:var(--doux);font-style:italic;font-size:.88rem;max-width:340px}
  .empty{text-align:center;padding:2.5rem;color:var(--doux)}
  .logout{background:transparent;border:1px solid var(--trait);color:var(--doux);padding:.5rem 1rem;border-radius:6px;cursor:pointer;font:400 .85rem 'Jost',sans-serif}
  .logout:hover{border-color:var(--or-fonce);color:var(--or-fonce)}
</style>
</head>
<body>

<!-- ====== ÉCRAN MOT DE PASSE ====== -->
<div class="gate" id="gate">
  <h2>Espace Admin</h2>
  <p style="color:var(--doux);font-size:.9rem;margin-bottom:1.2rem">Mariage Nathan &amp; Faouzio</p>
  <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password">
  <button id="loginBtn">Entrer</button>
  <p class="err" id="gateErr"></p>
</div>

<!-- ====== CONTENU ADMIN ====== -->
<div class="wrap" id="adminPanel" style="display:none">
  <h1>Réponses des invités</h1>
  <p class="sub">Mariage Nathan &amp; Faouzio · 28 novembre 2026</p>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Rechercher un nom…">
    <div style="display:flex;gap:.5rem">
      <button id="refreshBtn">↻ Rafraîchir</button>
      <button class="logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Nom</th>
        <th>Présence</th>
        <th>Pers.</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG ===== */
var SUPABASE_URL = "https://otdiywrvzappbmjfkkyi.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZGl5d3J2emFwcGJtamZra3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTQyMDcsImV4cCI6MjA4NTE5MDIwN30.O5gHqJF1SCvpu19Z0OFHhQsT_ZmeIFbuEu-bpBZXXtY";
var ADMIN_PWD = "nathan2026"; // ⚠️ à changer
/* ================== */

var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var DATA = [];
var $ = function(id){ return document.getElementById(id); };

/* ===== LOGIN ===== */
function tryLogin(){
  if($("pwd").value === ADMIN_PWD){
    sessionStorage.setItem("nf_admin", "1");
    showPanel();
  } else {
    $("gateErr").textContent = "Mot de passe incorrect";
    $("pwd").value = "";
  }
}
$("loginBtn").addEventListener("click", tryLogin);
$("pwd").addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });

function showPanel(){
  $("gate").style.display = "none";
  $("adminPanel").style.display = "block";
  loadData();
}

$("logoutBtn").addEventListener("click", function(){
  sessionStorage.removeItem("nf_admin");
  location.reload();
});

/* ===== CHARGEMENT ===== */
async function loadData(){
  $("rows").innerHTML = '<tr><td colspan="5" class="empty">Chargement…</td></tr>';
  var res = await db.from("rsvp_mariage").select("*").order("created_at", { ascending: false });
  if(res.error){
    console.error(res.error);
    $("rows").innerHTML = '<tr><td colspan="5" class="empty">Erreur de chargement.</td></tr>';
    return;
  }
  DATA = res.data || [];
  renderStats();
  renderRows(DATA);
}

/* ===== STATS ===== */
function renderStats(){
  var total = DATA.length;
  var oui = DATA.filter(function(r){ return r.presence; });
  var non = total - oui.length;
  var personnes = oui.reduce(function(s, r){ return s + (r.nombre_personnes || 0); }, 0);

  $("stats").innerHTML =
    '<div class="stat"><b>' + total + '</b><span>Réponses</span></div>' +
    '<div class="stat"><b>' + oui.length + '</b><span>Présents</span></div>' +
    '<div class="stat"><b>' + non + '</b><span>Absents</span></div>' +
    '<div class="stat"><b>' + personnes + '</b><span>Total personnes</span></div>';
}

/* ===== TABLEAU ===== */
function renderRows(list){
  if(!list.length){
    $("rows").innerHTML = '<tr><td colspan="5" class="empty">Aucune réponse pour le moment.</td></tr>';
    return;
  }
  $("rows").innerHTML = list.map(function(r){
    var d = new Date(r.created_at).toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    return '<tr>' +
      '<td>' + d + '</td>' +
      '<td><strong>' + escapeHtml(r.nom) + '</strong></td>' +
      '<td><span class="badge ' + (r.presence ? 'badge--oui' : 'badge--non') + '">' + (r.presence ? 'Présent(e)' : 'Absent(e)') + '</span></td>' +
      '<td>' + (r.presence ? r.nombre_personnes : '—') + '</td>' +
      '<td class="mot">' + (r.mot ? escapeHtml(r.mot) : '—') + '</td>' +
    '</tr>';
  }).join("");
}

function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

/* ===== RECHERCHE ===== */
$("search").addEventListener("input", function(e){
  var q = e.target.value.toLowerCase().trim();
  if(!q){ renderRows(DATA); return; }
  renderRows(DATA.filter(function(r){ return r.nom.toLowerCase().indexOf(q) !== -1; }));
});

$("refreshBtn").addEventListener("click", loadData);

/* ===== AUTO-LOGIN SI SESSION ACTIVE ===== */
if(sessionStorage.getItem("nf_admin") === "1") showPanel();
</script>
</body>
</html>
